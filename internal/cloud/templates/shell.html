<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Move agent sessions between tools. Review a checkpoint, share it, and keep working."
    />
    <meta property="og:title" content="Moirai — Keep the thread" />
    <meta property="og:description" content="Portable sessions for AI agents" />
    <meta
      name="robots"
      content="{{if .Indexable}}index,follow{{else}}noindex,nofollow{{end}}"
    />
    {{if .Indexable}}
    <link rel="canonical" href="{{.Canonical}}" />
    {{end}}
    <meta property="og:image" content="{{.Origin}}/assets/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <title>{{.Title}} · Moirai</title>
    <link rel="stylesheet" href="/assets/site.css" />
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <a class="brand" href="/">moirai<span>✳</span></a>
      <nav>
        <a href="https://github.com/october-dev/moirai#readme">Docs</a
        ><a href="/app">Your sessions</a
        ><a class="button small" href="/auth/start">Sign in with GitHub</a>
      </nav>
    </header>
    <main id="main">
      <h1>{{.Title}}</h1>
      <p class="lede">{{.Description}}</p>
      {{template "content" .Data}}
    </main>
    <footer>
      <span>Keep the thread. Keep control.</span
      ><a href="/privacy">Privacy & sharing</a
      ><a href="https://github.com/october-dev/moirai/issues">Support</a
      ><a href="https://github.com/october-dev/moirai/releases">Releases</a>
    </footer>
  </body>
</html>
