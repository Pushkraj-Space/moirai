name: moirai-integration
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: moirai_test
      POSTGRES_PASSWORD: synthetic-test-password
      POSTGRES_DB: moirai_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U moirai_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  s3:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: moirai_test
      MINIO_ROOT_PASSWORD: synthetic-storage-password
    ports:
      - "127.0.0.1:59000:9000"
    tmpfs:
      - /data
