name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/package.yml
  binaries:
    if: github.repository == 'october-dev/moirai'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets
      - name: Verify packaged version and checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p "require('./sdk/typescript/package.json').version")"
          cd release-assets
          sha256sum --check *.sha256
          cat *.sha256 > SHA256SUMS
      - name: Smoke test released Linux amd64 archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          smoke_dir="$(mktemp -d)"
          tar -xzf "release-assets/moirai_${version}_linux_amd64.tar.gz" -C "$smoke_dir"
          test -f "$smoke_dir/LICENSE"
          test "$("$smoke_dir/moirai" version)" = "$version"
      - run: node .github/scripts/manifests.mjs release-assets
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.exe
      - name: Publish binary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/*.tar.gz release-assets/*.exe release-assets/SHA256SUMS release-assets/*.rb release-assets/*.yaml
  npm:
    needs: packages
    name: Publish npm with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Require tag, npm, and CLI versions to match
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          cli_version="$(cd ../.. && go run ./cmd/moirai version)"
          test "$tag_version" = "$package_version"
          test "$tag_version" = "$cli_version"
      - run: npm ci
      - run: npm test
      - run: npm audit
      - name: Require trusted-publishing capable npm
        run: |
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if(v[0]<11 || (v[0]===11 && v[1]<5)) process.exit(1)"
      - run: npm publish --provenance --access public
